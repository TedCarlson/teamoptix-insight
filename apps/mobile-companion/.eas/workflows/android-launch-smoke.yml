name: Android launch smoke

jobs:
  build_android:
    name: Build Android emulator APK
    type: build
    params:
      platform: android
      profile: e2e-test

  test_android:
    name: Verify Android launch and rotation
    needs: [build_android]
    type: maestro
    environment: production
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: [".maestro/android-launch.yml"]
