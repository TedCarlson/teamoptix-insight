name: Supabase migration alignment

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/check-supabase-migration-alignment.mjs"
      - ".github/workflows/supabase-migration-alignment.yml"
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-alignment
  cancel-in-progress: true

jobs:
  compare-ledgers:
    name: Compare repository and linked Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Require deployment guard secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Compare migration ledgers
        run: node scripts/check-supabase-migration-alignment.mjs
